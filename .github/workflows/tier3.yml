# Tier 3 -- the live smoke test. Note 00 §3's fourth tier, and §8's question answered:
# it gates a release.
#
# Deliberately NOT on pull requests. Note 00 §5 records that repository secrets are
# unavailable to workflows triggered by PRs from forks, so a PR trigger would fail
# every outside contribution -- which is why free hosted inference was rejected as a
# CI strategy in the first place.
name: Tier 3

on:
  workflow_call:
    # One per route in tests/tier3/test_live_smoke.py. None is required on its own;
    # the suite requires at least one -- see "Live smoke test" below.
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Live smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --locked --dev

      # `-m tier3` opts in: the default addopts exclude the marker, so this is the
      # only place the suite reaches a provider. Every route with a key runs four
      # checks; a route without one skips, visibly.
      #
      # There is no "require the key" step here any more, deliberately. A run where
      # every route skipped would exit green having called nothing -- a gate that
      # passes by doing nothing is worse than no gate, because it is believed -- and
      # `test_at_least_one_route_is_configured` fails that run from inside the suite,
      # next to the route list. A guard here would have to repeat the list, and would
      # be left behind the first time a route was added.
      - name: Live smoke test
        run: uv run pytest -m tier3 -rs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
