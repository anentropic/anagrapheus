
# SETUP REQUIRED: In GitHub repo Settings > Pages > Source, select "GitHub Actions"
# This enables the actions/deploy-pages action to publish the site.
name: Docs

on:
  push:
    branches:
      - main
  # Build (without deploying) on every PR, so a change that breaks the docs build
  # fails a check on the PR instead of on main after merging. Dependabot auto-merge
  # waits for this workflow too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Generate changelog
        run: uvx git-cliff -o CHANGELOG.md

      - name: Sync docs dependencies
        run: uv sync --locked --group docs

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    # Deploy only from main. PR runs (ref refs/pull/<n>/merge) and workflow_dispatch
    # runs on other branches build the site without publishing it.
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
