site_name: anagrapheus
site_description: Event-sourced timeline, belief store, and identity layer for long-running agents.
site_url: https://anentropic.github.io/anagrapheus/
repo_url: https://github.com/anentropic/anagrapheus
repo_name: anentropic/anagrapheus
edit_uri: edit/main/docs/src/
docs_dir: docs/src

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search
  - gen-files:
      scripts:
        - docs/scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters:
              - "!^_"
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Tutorials:
      - tutorials/index.md
      - tutorials/getting-started.md
      - tutorials/negotiation-example.md
  - How-To Guides:
      - how-to/index.md
      - how-to/record-and-replay.md
      - how-to/pin-model-and-tool-calls.md
      - how-to/per-agent-beliefs.md
      - how-to/identity-and-rekey.md
      - how-to/chronicle-sections.md
      - how-to/assemble-prompts.md
      - how-to/evolve-event-schemas.md
  - Explanation:
      - explanation/index.md
      - explanation/architecture.md
      - explanation/event-log-and-projections.md
      - explanation/pinning-and-replay.md
      - explanation/beliefs.md
      - explanation/identity.md
      - explanation/chronicle.md
      - explanation/prompt-assembly.md
  - Reference: reference/
  - Changelog: changelog.md
