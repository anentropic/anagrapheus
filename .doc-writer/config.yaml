# .doc-writer/config.yaml — generated by /doc-writer:setup
version: 1

plugin_version: "1.7.1"

user_personas:
  - name: "Python developers building long-running, replayable LLM agents"
    skill_level: "advanced"
    assumed_knowledge:
      - "modern Python (3.12+), type hints, dataclasses, async/await"
      - "pydantic and pydantic-ai agents, models and tools"
      - "calling LLM APIs and the cost and nondeterminism of model calls"
      - "SQLite and basic persistence"
    never_assume:
      - "event sourcing vocabulary as this library uses it (envelope, upcast, fold, projection, position)"
      - "what pinning a model call means, and how replay differs from re-running"
      - "the belief store's terms (scope, proposition, predicate, revise/expand/contract, doxastica)"
      - "the identity layer (decisions, establish, merge, re-key)"
      - "the chronicle (sections, consolidation, recency vs depth)"
      - "prompt assembly terms (grant, slice, part, register, budget)"
      - "which pieces are the library's job and which are the application's"
    domain_context: "agents and simulations that run for many turns, hold private beliefs about each other, and must replay a past run exactly without calling the model again (games, negotiations, interactive fiction such as narrative-vm)"
    discovery_story: "comes from the narrative-vm design or from needing deterministic replay of an LLM agent, and reads the negotiation example first"
    user_tasks:
      - "record a run to an event log and replay it offline"
      - "pin model and tool calls so retries and replays reuse the same draw"
      - "keep per-agent beliefs that are a fold over the log"
      - "resolve entity identity and re-key beliefs after a merge"
      - "consolidate history into chronicle sections for long contexts"
      - "assemble prompts from granted slices with provenance and a budget"
      - "evolve event schemas with upcasters without breaking old logs"

tone: "warm-businesslike"

use_cases:
  - title: "Replay an agent run exactly"
    problem: "LLM agents are nondeterministic and expensive, so a bug seen once cannot be reproduced and tests hit the network"
    capability: "every model and tool call is pinned to an event log, keyed on what the model was asked"
    outcome: "a recorded run replays offline, byte for byte, and a changed prompt fails loudly instead of silently re-drawing"
  - title: "Agents that believe different things"
    problem: "multi-agent simulations need each agent to hold private, revisable beliefs that cannot leak into another agent's prompt"
    capability: "beliefs are a fold over the log, scoped per holder, and prompts are assembled only from granted slices that record their sources"
    outcome: "a prompt can be checked to contain only what its agent was allowed to see"

use_cases_section: false

doc_system: "mkdocs-material"
api_reference: "mkdocstrings"

paths:
  docs_root: "docs/src/"
  source_root: "src/"

detected:
  language: "Python"
  doc_system: "mkdocs-material"
  existing_docs: false

qa_answers:
  navigation: "Sections as top tabs"
  api_docs: "mkdocstrings"
  features:
    - "Content tabs"
    - "Mermaid diagrams"
    - "Code annotations"
    - "Admonitions"
    - "Collapsible details"
