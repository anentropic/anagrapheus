    scenarios:
      - id: S1
        goal: "I want to run the negotiation example offline and check for myself that its replay reaches no model, then find where each layer lives in its code"
        starting_point: "README.md"
        persona_relevance: "The persona usually arrives through the negotiation example (from the narrative-vm design work) and wants proof of the replay claim before adopting the library"
        done_when: "The example runs offline from a clone, the tour script prints the log, pins, per-scope beliefs, chronicle, an assembled prompt, a merge re-key and a replay with divergence None, and the reader can name the example module behind each layer"
      - id: S2
        goal: "I want to record my own multi-step pydantic-ai agent (with a tool that reads the world) to a recording file and replay it offline in a test, with a changed prompt failing loudly"
        starting_point: "README.md"
        persona_relevance: "Deterministic replay of expensive, nondeterministic agent runs is the core reason this persona looks at the library"
        done_when: "Model and tool calls are pinned, a recording file is written and replayed in a fresh store with zero model and tool calls, a changed prompt raises PinMiss with a Divergence, and the reader knows how to choose a call policy, retry within a unit, abandon a unit and resume after a crash"
      - id: S3
        goal: "I want each agent to hold private beliefs as a fold over the log, and when two names turn out to be one party, merge them and move every belief onto the survivor in every scope"
        starting_point: "README.md"
        persona_relevance: "Multi-agent simulations with private, revisable beliefs about entities whose identity is discovered over time are the persona's domain"
        done_when: "Predicates are declared, beliefs are written as events and folded per scope, divergence between two scopes is measured, the fold rebuilds (including after reopening the database), entity ids are minted so a replay re-establishes them, a merge is recorded, and the application applies the re-key plan in every scope"
      - id: S4
        goal: "I want an agent's prompt for a long negotiation to contain the summarised past from the chronicle plus the recent raw offers, only from what that agent was granted, within a size budget, sent through the pinned model"
        starting_point: "README.md"
        persona_relevance: "Long histories overflow the context window; the persona needs consolidation and leak-free prompt assembly together, not separately"
        done_when: "Closed rounds are consolidated into sections with pins, a grant combining a ChronicleSlice and a LogSlice of events after the consolidated position is assembled with a Budget, chronicle prose appears labelled as generated, the leak check passes, and the reader knows how to rebuild or carry the chronicle safely"
      - id: S5
        goal: "I want to add required fields to one of my event types while logs written by last release still read, fold into my own projection, and replay"
        starting_point: "README.md"
        persona_relevance: "A long-running agent's log outlives many releases of its code, so schema evolution without rewriting the log is required"
        done_when: "The new version is registered, an upcast is registered from v1, an EventReader returns old events in the new shape, an application fold over the event catches up through the projector seeing the new shape, recordings replay with upcasts, and the error messages for gaps and duplicates are recognisable"
