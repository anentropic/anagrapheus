[project]
name = "anagrapheus"
version = "0.1.0"
description = "Event-sourced timeline, belief store, and identity layer for long-running agents."
readme = "README.md"
authors = [
    { name = "Anentropic", email = "ego@anentropic.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.0",
    "doxastica>=0.2,<0.3",
    "pydantic>=2.11,<3",
    "pydantic-ai-slim>=1.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<1.0.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# Only tier 3 -- the live smoke test -- needs a real provider. Kept out of the base
# install so the library stays provider-agnostic: pydantic-ai is the seam, and which
# provider sits behind it is the consumer's choice.
anthropic = ["pydantic-ai-slim[anthropic]>=1.0"]
# The OpenAI SDK, which pydantic-ai uses for OpenAI itself and for every
# OpenAI-compatible route -- OpenRouter among them. Named for what it installs, as
# pydantic-ai names its own extra, rather than for one provider that uses it.
openai = ["pydantic-ai-slim[openai]>=1.0"]

[dependency-groups]
dev = [
    "anagrapheus[anthropic,openai]",
    "basedpyright>=1.38.0",
    "ipython>=9.10.0",
    "pdbpp>=0.12.0.post1",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.1",
    "hypothesis>=6.130",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
]

[tool.pyright]
# The minimum supported version, not the dev version: an explicit pythonVersion
# overrides the running interpreter, so setting it to the dev version lets newer
# stdlib and typing APIs type-check clean on *every* CI leg -- including the
# minimum-version leg whose job is to catch them -- and fail at runtime instead.
# Kept in step with requires-python and ruff's target-version below.
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportPrivateUsage = false

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint.flake8-type-checking]
# pydantic resolves field annotations at model build; imports its models use must
# stay runtime even when they look annotation-only.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "anagrapheus.timeline.envelope.DomainEvent",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "D"]
ignore = [
    "D1",    # don't require docstrings everywhere
    "D202",  # allow blank line after docstring (common in tests)
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D212",  # conflicts with D213 (multiline summary on second line)
    "D401",  # imperative mood is awkward for dunder methods
    "D413",  # blank line after last section not required
]

[tool.pytest.ini_options]
addopts = "-v -m 'not tier3'"
markers = [
    # Tier 3 costs money and needs a key, so it is excluded by default rather than
    # skipped noisily on every local run. `-m tier3` opts in.
    "tier3: reaches a real provider; needs a key for at least one route in tests/tier3",
]
